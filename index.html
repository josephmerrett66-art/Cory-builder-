<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dusk Town — city builder prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#191a1c; --bg2:#0e0f10;
    --panel:#232527; --panel2:#1b1d1f;
    --edge:#000000; --edge2:#3d4145;
    --ink:#f3f4f5; --ink-soft:#9ba0a5;
    --verge:#0b0c0d;
    --gold:#ffffff; --ada:#8d9297;
    --ok:#e8eaec; --bad:#c3c8cc; --focus:#ffffff;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#dcdee1; --bg2:#c4c7cb;
      --panel:#f5f6f7; --panel2:#e8eaec;
      --edge:#0d0e0f; --edge2:#a7abb0;
      --ink:#121416; --ink-soft:#585e64;
      --verge:#0b0c0d;
      --gold:#121416; --ada:#6d7278;
      --ok:#121416; --bad:#3d4145; --focus:#121416;
    }
  }
  :root[data-art="illustrated"]{
    --bg:#e7d6b5;--bg2:#c9b082;
    --panel:#f4ead5;--panel2:#dfcba7;
    --edge:#4e3d2a;--edge2:#9b7b52;
    --ink:#30261b;--ink-soft:#6b5840;
    --verge:#769451;--gold:#b56b32;--ada:#667b83;
    --ok:#3f7652;--bad:#a84f3f;--focus:#fff3c9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);background-image:linear-gradient(var(--bg),var(--bg2));
    background-attachment:fixed;color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;line-height:1.55;padding:12px 10px 40px;
  }
  :root[data-art="illustrated"] body{
    background-color:var(--bg);
    background-image:
      radial-gradient(circle at 18% 8%,rgba(255,250,221,.72),transparent 34%),
      linear-gradient(145deg,var(--bg),var(--bg2));
    font-family:Georgia,"Times New Roman",serif;
  }
  .wrap{max-width:1080px;margin:0 auto}
  .topbar{
    display:flex;align-items:baseline;justify-content:space-between;
    gap:12px;margin:0 0 9px;
  }
  h1{
    font-family:"Silkscreen","Courier New",monospace;font-weight:700;
    font-size:17px;letter-spacing:.02em;margin:0;text-shadow:2px 2px 0 var(--edge);
  }
  :root[data-art="illustrated"] h1,
  :root[data-art="illustrated"] .rowlabel,
  :root[data-art="illustrated"] .card h2,
  :root[data-art="illustrated"] .status,
  :root[data-art="illustrated"] button.act,
  :root[data-art="illustrated"] .vs-side .who,
  :root[data-art="illustrated"] .vs-side .num,
  :root[data-art="illustrated"] .scoreline span:last-child,
  :root[data-art="illustrated"] .count{
    font-family:Georgia,"Times New Roman",serif;
    letter-spacing:.02em;text-shadow:none;
  }
  .top-tools{display:flex;align-items:center;gap:13px}
  .art-picker{display:flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:12px}
  .art-picker select{
    appearance:none;background:var(--panel);color:var(--ink);border:2px solid var(--edge2);
    border-radius:0;padding:5px 25px 5px 8px;font:inherit;line-height:1.1;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
    background-position:calc(100% - 11px) 50%,calc(100% - 7px) 50%;background-size:4px 4px;background-repeat:no-repeat;
  }
  .scores{display:flex;gap:14px;align-items:baseline}
  .vs-side{display:flex;gap:5px;align-items:baseline}
  .vs-side .who{
    font-family:"Silkscreen",monospace;font-size:9px;font-style:normal;color:var(--ink-soft);
  }
  .vs-side .num{font-family:"Silkscreen",monospace;font-size:19px;font-weight:400}
  #vsyou .num{color:var(--gold)}
  #vsbot .num{color:var(--ada)}
  .vs-side.behind .num{opacity:.45}
  .layout{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
  .boardcol{flex:1 1 420px;min-width:300px;max-width:560px;display:flex;flex-direction:column;gap:9px}
  .panel-col{flex:1 1 280px;min-width:262px;display:flex;flex-direction:column;gap:13px}
  .rowlabel{
    font-family:"Silkscreen","Courier New",monospace;font-size:9px;
    color:var(--ink-soft);letter-spacing:.04em;margin:11px 0 6px;
  }
  .board{
    display:grid;
    /* whole-pixel tracks: fractional ones make the 1px gaps round unevenly */
    grid-template-columns:repeat(var(--mapsize,13),var(--cellpx,24px));
    grid-template-rows:repeat(var(--mapsize,13),var(--cellpx,24px));
    width:max-content;margin:0 auto;
    gap:1px;background:#20241f;padding:1px;
    border:3px solid var(--edge);
    box-shadow:0 0 0 2px var(--edge2);
  }
  :root[data-art="illustrated"] .board{
    gap:2px;background:#5d4a31;padding:2px;border-width:4px;
    box-shadow:0 5px 18px rgba(50,35,20,.38),0 0 0 2px #ba9867;
  }
  .cell svg{position:relative;z-index:0}
  .cell{overflow:visible}
  .cell.tall svg{
    position:absolute;left:0;bottom:0;width:100%;height:150%;z-index:4;
  }
  .cell{
    width:var(--cellpx,24px);height:var(--cellpx,24px);padding:0;border:0;
    background:var(--verge);display:block;position:relative;cursor:default;
  }
  .cell svg{display:block;width:100%;height:100%}
  .pixel-sprite{
    display:block;image-rendering:pixelated;image-rendering:crisp-edges;
    shape-rendering:crispEdges;
  }
  .illustrated-sprite{
    display:block;width:100%;height:100%;position:relative;overflow:hidden;
    object-fit:cover;
  }
  .illustrated-road-art{transform:rotate(var(--road-rotation,0deg))}
  .cell.tall svg.illustrated-sprite,.tile.tall svg.illustrated-sprite{
    position:relative;left:auto;bottom:auto;width:100%;height:100%;
  }
  .cell.own-you::before,.cell.own-bot::before{
    content:"";position:absolute;top:0;right:0;
    border-top:7px solid var(--gold);border-left:7px solid transparent;
    filter:drop-shadow(-1px 1px 0 rgba(0,0,0,.7));z-index:7;
  }
  .cell.own-bot::before{border-top-color:var(--ada)}
  .cell.legal::after{
    content:"";position:absolute;inset:3px;
    border:2px dashed var(--gold);background:rgba(255,255,255,.18);
  }
  .cell.legal{cursor:pointer}
  .cell.inspect{box-shadow:inset 0 0 0 3px var(--focus)}
  .cell.fresh{box-shadow:inset 0 0 0 3px var(--ada)}
  .cell:focus-visible{outline:3px solid var(--focus);outline-offset:-3px;z-index:2}
  .card{background:var(--panel);border:3px solid var(--edge);padding:12px 13px}
  :root[data-art="illustrated"] .card,
  :root[data-art="illustrated"] dialog{
    border-radius:5px;box-shadow:0 4px 12px rgba(55,39,22,.2);
    background-image:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,0));
  }
  .card.tight{padding:10px 11px}
  .card h2{
    font-family:"Silkscreen","Courier New",monospace;font-size:11px;font-weight:700;
    margin:0 0 9px;color:var(--ink-soft);letter-spacing:.04em;
  }
  .tilerow{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .tile{
    width:46px;height:46px;padding:0;border:2px solid var(--edge);
    background:var(--verge);cursor:pointer;display:block;position:relative;
    box-shadow:0 0 0 1px var(--edge2);
  }
  .tile svg{display:block;width:100%;height:100%}
  .tile .illustrated-sprite{display:block;width:100%;height:100%}
  .upgrade-card-art{display:block;position:relative;width:100%;height:100%;overflow:hidden}
  .upgrade-card-art>svg,.upgrade-card-art>.illustrated-sprite{display:block;width:100%;height:100%}
  .upgrade-mark{
    position:absolute;left:3px;top:3px;z-index:8;display:grid;place-items:center;
    width:15px;height:15px;border:2px solid #fff4d3;background:#b56b32;color:#fff;
    font:700 11px/1 ui-sans-serif,sans-serif;box-shadow:1px 1px 0 rgba(0,0,0,.65);
    pointer-events:none;
  }
  :root:not([data-art="illustrated"]) .upgrade-mark{border-radius:0;background:#e0655a}
  .tile.tall{overflow:visible}
  .tile.tall svg{position:absolute;left:0;bottom:0;height:150%}
  .tile[disabled]{opacity:.35;cursor:not-allowed}
  .tile.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
  .tile.must{border-color:var(--bad)}
  .tile:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .count{
    position:absolute;right:-6px;bottom:-8px;font-family:"Silkscreen",monospace;font-size:10px;
    background:var(--panel2);border:2px solid var(--edge);padding:0 3px;color:var(--ink);
  }
  .status{
    font-family:"Silkscreen","Courier New",monospace;font-size:10.5px;
    line-height:1.6;min-height:2.2em;color:var(--ink-soft);margin-bottom:9px;
  }
  .status b{color:var(--ink)}
  .scoreline{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .scoreline span:first-child{color:var(--ink-soft);font-size:13px}
  .scoreline span:last-child{font-family:"Silkscreen",monospace;font-size:12px}
  .scoreline.good span,.scoreline.warn span{color:inherit}
  .scoreline.good{color:#7fce9c}
  .scoreline.warn{color:#f08a72}
  button.act{
    font-family:"Silkscreen","Courier New",monospace;font-size:10px;
    background:var(--panel2);color:var(--ink);border:2px solid var(--edge);
    padding:7px 9px;cursor:pointer;
  }
  button.act:hover:not([disabled]){border-color:var(--gold);color:var(--gold)}
  button.act[disabled]{opacity:.4;cursor:not-allowed}
  button.act:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .acts{display:flex;gap:6px;flex-wrap:wrap}
  .legend{font-size:13px;color:var(--ink-soft);line-height:1.5}
  .legend div{
    display:flex;gap:10px;align-items:flex-start;
    padding:9px 0;border-top:1px solid var(--edge2);
  }
  .legend div:first-of-type{border-top:0}
  .legend svg{width:34px;height:34px;flex:0 0 34px;display:block;border:2px solid var(--edge)}
  .legend .illustrated-sprite{width:38px;height:38px;flex:0 0 38px;border:2px solid var(--edge)}
  .legend svg.tall{height:51px}
  .legend b{color:var(--ink)}
  .legend .note{
    margin:0 0 4px;font-size:12.5px;color:var(--ink-soft);
  }
  dialog{
    border:4px solid var(--edge);background:var(--panel);color:var(--ink);
    padding:20px;max-width:430px;width:calc(100% - 32px);
  }
  dialog::backdrop{background:rgba(0,0,0,.72)}
  dialog h2{font-family:"Silkscreen",monospace;font-size:15px;margin:0 0 12px}
  .map-info{font-size:12px;color:var(--ink-soft);text-align:center;margin:0}
  #playmode,#gameseed{display:block;width:100%;margin:7px 0 14px;padding:10px;
    background:var(--panel2);color:var(--ink);border:2px solid var(--edge2);font:inherit}
  #setup p{font-size:14px;color:var(--ink-soft)}
  @media (max-width:880px){
    body{padding:10px 6px 30px}
    .wrap{max-width:100%}
    .boardcol{flex:1 1 100%;max-width:100%;min-width:0}
    .tile{width:42px;height:42px}
  }
  @media (max-width:620px){
    .topbar{align-items:flex-start}.top-tools{align-items:flex-end;flex-direction:column;gap:5px}
    .art-picker{font-size:11px}
  }
  @media (max-width:380px){
    .tile{width:38px;height:38px}
  }

  .towns{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--bg);padding:6px 0 12px;margin-bottom:10px}
  .town{border:2px solid var(--edge2);background:var(--panel);padding:9px 12px}
  .town.active-town{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
  .town .population{font-weight:bold;border-top:1px solid var(--edge2);margin-top:3px}
  .town .population span{color:var(--ink);font-size:16px}
  #winrule,.hint{font-size:12px;color:var(--ink-soft)}
  .tile-info,.placement-preview{font-size:13px;margin-bottom:10px;padding:9px;border:1px solid var(--edge2);background:var(--panel2)}
  .placement-preview table{border-collapse:collapse;width:100%;margin-top:5px;text-align:left}
  .placement-preview th,.placement-preview td{padding:3px 6px;border-bottom:1px solid var(--edge2)}
  .placement-preview p{margin:5px 0}
  .range-mark{display:none}
  .cell.in-range .range-mark{display:block;position:absolute;inset:0;z-index:4;pointer-events:none;border:1px solid #e8b956;background:rgba(232,185,86,.24)}
  .cell.proposed::after{content:"";position:absolute;inset:1px;z-index:6;border:3px solid #fff1a0;background:rgba(237,193,88,.38);pointer-events:none}
  .cell.legal::after{z-index:5;pointer-events:none}
  .tilerow:has(.tile.tall){padding-top:23px}
  details summary{cursor:pointer;font-weight:bold;font-size:13px}
  #breakdown h3{margin:12px 0 5px;font-size:14px}
  @media(max-width:420px){.town{padding:6px}.town .scoreline span{font-size:11px}.town .population span{font-size:14px}.topbar{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Dusk Town</h1>
    <div class="top-tools">
      <label class="art-picker" for="artstyle">Art
        <select id="artstyle" aria-label="Art style">
          <option value="illustrated">Illustrated</option>
          <option value="pixel">Pixel</option>
        </select>
      </label>
      <span id="winrule"></span>
    </div>
  </div>

  <section class="towns" aria-label="Town populations"><div id="town-you" class="town"></div><div id="town-bot" class="town"></div></section>
  <div class="layout">
    <div class="boardcol">
      <div class="board" id="board" role="grid" aria-label="The shared city grid"></div>
      <p class="map-info" id="mapinfo"></p>

      <div class="card tight">
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div id="tileinfo" class="tile-info" hidden></div>
        <div id="placementpreview" class="placement-preview" aria-live="polite" hidden></div>
        <div class="acts">
          <button class="act" id="rotate">Rotate &#8635;</button>
          <button class="act" id="confirm">Confirm placement</button>
          <button class="act" id="cancelplacement">Cancel selection</button>
          <button class="act" id="endturn">Pass</button>
          <button class="act" id="undo">Undo last move</button>
          <button class="act" id="finish" disabled>Results</button>
          <button class="act" id="restart">New game</button>
        </div>
        <div class="rowlabel" id="marketcount">Shared market</div>
        <div class="tilerow" id="market"></div>
        <div class="rowlabel" id="roadcount">Road stack</div>
        <div class="tilerow" id="roadrow"></div>
        <div class="rowlabel" id="handlabel">Your hand</div>
        <div class="tilerow" id="hand"></div>
        <div class="rowlabel" id="civiclabel">Unused Civic Tiles</div>
        <div class="tilerow" id="civics"></div>
        <p id="hospitalhint" class="hint"></p>
      </div>
    </div>

    <div class="panel-col">
      <details class="card"><summary>Debug town breakdown</summary>
        <div id="breakdown"></div><button class="act" id="logtown">Log town calculations</button>
      </details>
      <div class="card">
        <h2>Rules index</h2>
        <div class="legend" id="legend"></div>
      </div>
    </div>
  </div>
</div>

<dialog id="setup" aria-labelledby="setuptitle">
  <h2 id="setuptitle">Start a new town</h2>
  <p id="setupsummary"></p>
  <label for="playmode">Players</label>
  <select id="playmode"><option value="local">Two players · same device</option><option value="bot">You vs Ada</option></select>
  <label for="gameseed">Game seed (optional)</label>
  <input id="gameseed" type="text" maxlength="64" placeholder="Leave blank for a new shuffle">
  <p>Reuse a seed to repeat the same tile supply. Population is the lower of Accommodation and Attraction. Player 2 receives an equal final turn.</p>
  <div class="acts">
    <button class="act" id="startgame">Start game</button>
    <button class="act" id="cancelsetup" hidden>Keep playing</button>
  </div>
</dialog>

<dialog id="over" aria-labelledby="overtitle">
  <h2 id="overtitle">Final populations</h2>
  <div id="overbody"></div>
  <div class="acts" style="margin-top:16px">
    <button class="act" id="viewmap">View map</button>
    <button class="act" id="again">Play again</button>
  </div>
</dialog>

<script>
"use strict";

var ART_STYLE="illustrated";
try{
  if(window.localStorage){
    var savedArt=window.localStorage.getItem("dusk-town-art-style");
    if(savedArt==="pixel"||savedArt==="illustrated") ART_STYLE=savedArt;
  }
}catch(ignoreArtStorage){}
if(document.documentElement) document.documentElement.setAttribute("data-art",ART_STYLE);

/* ===================== palette ===================== */
var PAL = {
  g:"#3e6a3d", G:"#335935", h:"#487846",
  L:"#2a4526", I:"#466e43", O:"#6b6740", T:"#5f5340",
  i:"#2c2a45", l:"#4a4460",
  r:"#c4483f", t:"#e0655a", R:"#8f3129",
  u:"#4a6fa8", J:"#6b90c8", U:"#33507a",
  c:"#e6d5b8", C:"#c0ad8c",
  x:"#b5654a", X:"#8c4a34",
  y:"#ffd98a", w:"#8fd4e8", Y:"#f2a83c",
  d:"#6b4630", q:"#bdb39a", Q:"#9c9280",
  f:"#4fae5c", F:"#2f6f3a", H:"#79cc7d", b:"#7a5738",
  p:"#e8709a", P:"#f2c94c",
  W:"#4fa8d8", V:"#2f7fae", B:"#7fd0ee",
  v:"#a3a8c4",
  s:"#3a6f8a", S:"#f0e4cc", e:"#2f6d80", A:"#f2e6cd",
  k:"#8f8799", K:"#645d75", M:"#b8b2c6",
  m:"#c3c7dc",
  a:"#6b6f8f", o:"#e8a33d", n:"#9ba0bd", z:"#d8ce3a",
  j:"#27452a", D:"#2b3247"
};

/* ===================== sprite helpers ===================== */
var SZ=32;
function blank(){ var g=[]; for(var y=0;y<SZ;y++){ g.push(new Array(SZ).fill("g")); } return g; }
function px(g,x,y,ch){ if(x>=0&&x<SZ&&y>=0&&y<SZ){ g[y][x]=ch; } }
function rect(g,x,y,w,h,ch){ for(var j=0;j<h;j++){ for(var i=0;i<w;i++){ px(g,x+i,y+j,ch); } } }
function frame(g,x,y,w,h,ch){
  for(var i=0;i<w;i++){ px(g,x+i,y,ch); px(g,x+i,y+h-1,ch); }
  for(var j=0;j<h;j++){ px(g,x,y+j,ch); px(g,x+w-1,y+j,ch); }
}
function rnd(seed){ var s=(seed*9301+49297)%233280; return function(){ s=(s*9301+49297)%233280; return s/233280; }; }
function speckle(g,seed,n){
  var R2=rnd(seed+7), k=n||46;
  for(var i=0;i<k;i++){
    var x=Math.floor(R2()*SZ), y=Math.floor(R2()*SZ);
    if(g[y][x]==="g"){ g[y][x]=R2()>.5?"G":"h"; }
  }
}
function blob(g,cx,cy,rx,ry,ch,hi,lo){
  for(var y=cy-ry;y<=cy+ry;y++){
    for(var x=cx-rx;x<=cx+rx;x++){
      var dx=(x-cx)/rx, dy=(y-cy)/ry;
      if(dx*dx+dy*dy<=1.04){
        var cc=ch;
        if(hi&&(x-cx)+(y-cy)<-rx*0.65) cc=hi;
        if(lo&&(x-cx)+(y-cy)>rx*0.8) cc=lo;
        px(g,x,y,cc);
      }
    }
  }
}
/* soft ground shadow so buildings sit on the land rather than float */
function groundShadow(g,cx,cy,rx){ blob(g,cx,cy,rx,2,"j"); }
function tree(g,cx,cy,r){
  groundShadow(g,cx,cy+r+3,r-1);
  blob(g,cx,cy,r,r,"f","H","F");
  rect(g,cx-1,cy+r-1,2,5,"b"); px(g,cx-1,cy+r+2,"F");
  px(g,cx-r,cy,"F"); px(g,cx+r,cy+1,"F");
}
function fenceRun(g,x,y,w){
  for(var i=0;i<w;i+=3){ px(g,x+i,y,"b"); px(g,x+i,y+1,"b"); }
  for(var i=0;i<w;i++){ px(g,x+i,y,"b"); }
}

/* ---- size-aware helpers, for the 2x2 sports centre ---- */
function bigGrid(n){ var g=[]; for(var y=0;y<n;y++){ g.push(new Array(n).fill("g")); } return g; }
function bpx(g,x,y,ch){ var n=g.length; if(x>=0&&x<n&&y>=0&&y<n){ g[y][x]=ch; } }
function brect(g,x,y,w,h,ch){ for(var j=0;j<h;j++){ for(var i=0;i<w;i++){ bpx(g,x+i,y+j,ch); } } }
function bframe(g,x,y,w,h,ch){
  for(var i=0;i<w;i++){ bpx(g,x+i,y,ch); bpx(g,x+i,y+h-1,ch); }
  for(var j=0;j<h;j++){ bpx(g,x,y+j,ch); bpx(g,x+w-1,y+j,ch); }
}
function bblob(g,cx,cy,rx,ry,ch,hi,lo){
  for(var y=cy-ry;y<=cy+ry;y++){
    for(var x=cx-rx;x<=cx+rx;x++){
      var dx=(x-cx)/rx, dy=(y-cy)/ry;
      if(dx*dx+dy*dy<=1.02){
        var cc=ch;
        if(hi&&(x-cx)+(y-cy)<-rx*0.7) cc=hi;
        if(lo&&(x-cx)+(y-cy)>rx*0.8) cc=lo;
        bpx(g,x,y,cc);
      }
    }
  }
}
function bspeckle(g,seed){
  var n=g.length, R2=rnd(seed+3);
  for(var i=0;i<n*3;i++){
    var x=Math.floor(R2()*n), y=Math.floor(R2()*n);
    if(g[y][x]==="g"){ g[y][x]=R2()>.5?"G":"h"; }
  }
}
function quadrant(g,qx,qy,size){
  var out=[];
  for(var y=0;y<size;y++){ out.push(g[qy*size+y].slice(qx*size,qx*size+size)); }
  return out;
}

/* ===================== open land ===================== */
function grassSprite(v){
  var g=blank(), R=rnd(v*97+13);
  /* keep this sparse: each stray speckle splits a row into more SVG rects,
     and there are 169 of these on the board */
  speckle(g,v*31+5,10+Math.floor(R()*8));
  var shrubs=1+Math.floor(R()*3), i;
  for(i=0;i<shrubs;i++){
    var sx=2+Math.floor(R()*28), sy=2+Math.floor(R()*28), sr=1+Math.floor(R()*2);
    blob(g,sx,sy,sr+1,sr,"L");
    px(g,sx-1,sy-1,"I"); px(g,sx+1,sy,"I");
  }
  var blooms=2+Math.floor(R()*3);
  for(i=0;i<blooms;i++){
    var fx=1+Math.floor(R()*30), fy=1+Math.floor(R()*30);
    if(g[fy][fx]==="g"||g[fy][fx]==="G"||g[fy][fx]==="h"){ g[fy][fx]=R()>.5?"O":"T"; }
  }
  var tufts=2+Math.floor(R()*2);
  for(i=0;i<tufts;i++){
    var tx=1+Math.floor(R()*30), ty=1+Math.floor(R()*30);
    if(g[ty][tx]==="g"){
      g[ty][tx]="I";
      if(tx>0&&g[ty][tx-1]==="g") g[ty][tx-1]="G";
      if(tx+1<32&&g[ty][tx+1]==="g") g[ty][tx+1]="G";
      if(ty>0&&g[ty-1][tx]==="g") g[ty-1][tx]="L";
    }
  }
  return g;
}

  var wall=v===1?"x":"c", wsh=v===1?"X":"C";

  /* chimney, drawn before the roof so the roof laps over its base */
  rect(g,21,2,3,7,"X"); frame(g,21,2,3,7,"i"); rect(g,21,1,3,1,"K");
  /* pitched roof */
  for(var k=0;k<9;k++){
    var w=6+k*2, x=(SZ-w)/2, y=4+k;
    rect(g,x,y,w,1,main);
    for(var i=0;i<Math.floor(w/2);i++){ px(g,x+i,y,hi); }
    px(g,x,y,"i"); px(g,x+w-1,y,"i");
  }
  /* small staggered shingles give the roof texture without muddying its shape */
  for(var ry=7;ry<=12;ry+=2){
    for(var rx=8+(ry%4);rx<25;rx+=4){
      if(g[ry][rx]===main||g[ry][rx]===hi) px(g,rx,ry,lo);

  rect(g,6,25,20,2,wsh); frame(g,6,14,20,13,"i");
  /* windows with sills */
  [9,18].forEach(function(wx){
    frame(g,wx,17,5,5,"l"); rect(g,wx+1,18,3,3,"y");
    px(g,wx+1,18,"Y"); px(g,wx+3,20,"w"); rect(g,wx-1,22,7,1,"C");

/* ===================== high density ===================== */
/* 32 wide by 48 high. The bottom 32 rows sit in the tile; the top 16 overhang
   the row above, which is what makes the block read as tall. */
function tallGrid(){
  var g=[];
  for(var y=0;y<48;y++){ g.push(new Array(32).fill("g")); }
  return g;
}
function tpx(g,x,y,ch){ if(x>=0&&x<32&&y>=0&&y<48){ g[y][x]=ch; } }
function trect(g,x,y,w,h,ch){ for(var j=0;j<h;j++){ for(var i=0;i<w;i++){ tpx(g,x+i,y+j,ch); } } }
function tframe(g,x,y,w,h,ch){
  for(var i=0;i<w;i++){ tpx(g,x+i,y,ch); tpx(g,x+i,y+h-1,ch); }
  for(var j=0;j<h;j++){ tpx(g,x,y+j,ch); tpx(g,x+w-1,y+j,ch); }
}
function apartmentSprite(v){
  var g=tallGrid(), R=rnd(v*61+17), i, j;
  /* rows 16-47 are the tile itself and need turf; rows 0-15 overhang the row
     above and must stay transparent ("_" has no palette entry) */
  for(var y=0;y<16;y++){ for(var x=0;x<32;x++){ g[y][x]="_"; } }
  for(i=0;i<16;i++){
    var sx=Math.floor(R()*32), sy=16+Math.floor(R()*32);
    if(g[sy][sx]==="g") g[sy][sx]=R()>.5?"G":"h";
  }
  trect(g,3,44,26,2,"j");                    /* ground shadow */
  var wall=v===1?"x":"c", shade=v===1?"X":"C";
  /* plinth */
  trect(g,3,40,26,5,shade); tframe(g,3,40,26,5,"i");
  trect(g,5,41,4,3,"D"); trect(g,23,41,4,3,"D");
  /* entrance canopy and doors */
  trect(g,12,39,8,2,"K"); tframe(g,12,39,8,2,"i");
  trect(g,13,41,6,4,"l"); trect(g,14,42,4,3,"y");
  /* tower */
  trect(g,5,8,22,32,wall);
  trect(g,23,8,4,32,shade);                  /* shaded right face */
  tframe(g,5,8,22,32,"i");
  /* window grid, some lit some dark */
  for(j=0;j<8;j++){
    for(i=0;i<4;i++){
      var wx=7+i*5, wy=10+j*4;
      tframe(g,wx,wy,4,3,"l");
      trect(g,wx+1,wy+1,2,1, R()>0.42 ? "y" : "D");
      if((i+j)%3===0) tpx(g,wx+1,wy+1,"Y");
    }
  }
  /* balcony rails every other floor */
  for(j=1;j<8;j+=2){
    trect(g,6,12+j*4,20,1,"M");
    for(i=7;i<26;i+=4) tpx(g,i,11+j*4,"K");
  }
  /* roof slab, stair housing, water tank and aerial */
  trect(g,4,5,24,3,"K"); tframe(g,4,5,24,3,"i");
  trect(g,8,1,6,4,"K"); tframe(g,8,1,6,4,"i");
  trect(g,19,2,5,3,"M"); tframe(g,19,2,5,3,"i");
  trect(g,21,0,1,2,"i");
  tpx(g,22,0,"m"); tpx(g,4,39,"S"); tpx(g,27,39,"C");
  return g;
}

/* ===================== roads ===================== */
var N=1, E=2, Sd=4, Wd=8;
function roadSprite(mask){
  var g=blank(); speckle(g,mask*5+1,36);
  var lo=11, hi=20, y, x, i;
  rect(g,lo,lo,10,10,"a");
  if(mask&N){  rect(g,lo,0,10,lo,"a"); }
  if(mask&Sd){ rect(g,lo,hi+1,10,SZ-hi-1,"a"); }
  if(mask&E){  rect(g,hi+1,lo,SZ-hi-1,10,"a"); }
  if(mask&Wd){ rect(g,0,lo,lo,10,"a"); }

  /* footpath: two rows of paving either side of the carriageway, then a kerb */
  var edge=[];
  for(y=0;y<SZ;y++){
    for(x=0;x<SZ;x++){
      if(g[y][x]!=="a") continue;
      var nb=[[y-1,x],[y+1,x],[y,x-1],[y,x+1]];
      for(i=0;i<4;i++){
        var bb=nb[i][0], cc=nb[i][1];
        if(bb>=0&&bb<SZ&&cc>=0&&cc<SZ&&(g[bb][cc]==="g"||g[bb][cc]==="G"||g[bb][cc]==="h")){
          edge.push([y,x]); break;
        }
      }
    }
  }
  edge.forEach(function(p){ g[p[0]][p[1]]="v"; });
  var edge2=[];
  edge.forEach(function(p){
    [[p[0]-1,p[1]],[p[0]+1,p[1]],[p[0],p[1]-1],[p[0],p[1]+1]].forEach(function(q){
      if(q[0]>=0&&q[0]<SZ&&q[1]>=0&&q[1]<SZ&&g[q[0]][q[1]]==="a"){ edge2.push(q); }
    });
  });
  edge2.forEach(function(p){ g[p[0]][p[1]]="v"; });
  edge2.forEach(function(p){
    [[p[0]-1,p[1]],[p[0]+1,p[1]],[p[0],p[1]-1],[p[0],p[1]+1]].forEach(function(q){
      if(q[0]>=0&&q[0]<SZ&&q[1]>=0&&q[1]<SZ&&g[q[0]][q[1]]==="a"){ g[q[0]][q[1]]="n"; }
    });
  });
  /* mottled asphalt and hairline repairs add depth without obscuring exits */
  var roadR=rnd(mask*43+19);
  for(i=0;i<24;i++){
    var ax=Math.floor(roadR()*SZ), ay=Math.floor(roadR()*SZ);
    if(g[ay][ax]==="a") g[ay][ax]=roadR()>.72?"K":"a";
  }
  /* paving slabs, so the footpath doesn't read as flat grey */
  var R=rnd(mask*29+7);
  for(i=0;i<26;i++){
    var px1=Math.floor(R()*SZ), py1=Math.floor(R()*SZ);
    if(g[py1][px1]==="v") g[py1][px1]="n";
  }

  var arms=[];
  if(mask&N) arms.push("N");
  if(mask&E) arms.push("E");
  if(mask&Sd) arms.push("S");
  if(mask&Wd) arms.push("W");
  var junction=arms.length>=3;
  var crossing=junction?arms[0]:null;     /* one marked crossing per junction */

  function paint(cells,ch){
    cells.forEach(function(c){
      if(g[c[1]][c[0]]==="a"||g[c[1]][c[0]]==="n"||g[c[1]][c[0]]==="o"){ g[c[1]][c[0]]=ch; }
    });
  }
  /* centre line runs the length of the arm, broken 2-on 1-off */
  function dashes(dir){
    var cells=[], a, b, k;
    var cross=(dir===crossing);
    if(dir==="N"){ a=0; b=cross?5:(junction?9:10); }
    else if(dir==="S"){ a=cross?26:(junction?22:21); b=31; }
    else if(dir==="W"){ a=0; b=cross?5:(junction?9:10); }
    else { a=cross?26:(junction?22:21); b=31; }
    for(k=a;k<=b;k++){
      if(k%3===2) continue;
      if(dir==="N"||dir==="S"){ cells.push([15,k]); cells.push([16,k]); }
      else { cells.push([k,15]); cells.push([k,16]); }
    }
    paint(cells,"o");
  }
  function zebra(dir){
    var cells=[];
    if(dir==="N"||dir==="S"){
      var band=(dir==="N")?[6,7,8,9]:[22,23,24,25];
      band.forEach(function(ry){ [14,16].forEach(function(cx){ cells.push([cx,ry]); }); });
    } else {
      var bandx=(dir==="W")?[6,7,8,9]:[22,23,24,25];
      bandx.forEach(function(cx){ [14,16].forEach(function(ry){ cells.push([cx,ry]); }); });
    }
    paint(cells,"S");
  }
  function stopLine(dir){
    var cells=[], k;
    if(dir==="N"){ for(k=14;k<18;k++) cells.push([k,10]); }
    else if(dir==="S"){ for(k=14;k<18;k++) cells.push([k,21]); }
    else if(dir==="W"){ for(k=14;k<18;k++) cells.push([10,k]); }
    else { for(k=14;k<18;k++) cells.push([21,k]); }
    paint(cells,"S");
  }
  function stopSign(dir){
    /* sign face on the verge, post down to the footpath */
    if(dir==="N"){
      rect(g,9,5,3,3,"r"); px(g,10,6,"S"); px(g,10,8,"i"); px(g,10,9,"i");
    } else if(dir==="S"){
      rect(g,20,24,3,3,"r"); px(g,21,25,"S"); px(g,21,23,"i"); px(g,21,22,"i");
    } else if(dir==="W"){
      rect(g,5,20,3,3,"r"); px(g,6,21,"S"); px(g,8,21,"i"); px(g,9,21,"i");
    } else {
      rect(g,24,9,3,3,"r"); px(g,25,10,"S"); px(g,25,12,"i"); px(g,25,13,"i");
    }
  }

  if(mask===(N|Sd)||mask===(E|Wd)){
    /* a through road carries one unbroken dashed line end to end */
    var cells=[], k;
    for(k=0;k<SZ;k++){
      if(k%3===2) continue;
      if(mask===(N|Sd)){ cells.push([15,k]); cells.push([16,k]); }
      else { cells.push([k,15]); cells.push([k,16]); }
    }
    paint(cells,"o");
  } else {
    arms.forEach(function(d){
      if(d===crossing){ zebra(d); } else { dashes(d); }
      if(junction) stopLine(d);
    });
    if(crossing) stopSign(crossing);
  }

  /* centre of a crossroads stays clear of paint */
  if(arms.length===4){ rect(g,14,14,4,4,"a"); }
  /* storm drains sit beside the carriageway, reinforcing the road silhouette */
  if(mask&N){ rect(g,10,3,1,4,"K"); }
  if(mask&Sd){ rect(g,21,25,1,4,"K"); }
  if(mask&E){ rect(g,25,10,4,1,"K"); }
  if(mask&Wd){ rect(g,3,21,4,1,"K"); }
  return g;
}

var cache={};
function toSvg(g){
  var h=g.length, wdt=g[0].length;
  var out='<svg class="pixel-sprite" viewBox="0 0 '+wdt+' '+h+'" shape-rendering="crispEdges" aria-hidden="true">';
  for(var y=0;y<h;y++){
    var row=g[y], w=row.length, x=0;
    while(x<w){
      var ch=row[x], run=1;
      while(x+run<w&&row[x+run]===ch){ run++; }
      if(PAL[ch]){ out+='<rect x="'+x+'" y="'+y+'" width="'+run+'" height="1" fill="'+PAL[ch]+'"/>'; }
      x+=run;
    }
  }
  return out+'</svg>';
}

function illustratedRoad(mask){
  var file,rotation=0;
  if(mask===(N|Sd)) file="road-straight";
  else if(mask===(E|Wd)){ file="road-straight"; rotation=90; }
  else if(mask===3) file="road-corner";
  else if(mask===6){ file="road-corner"; rotation=90; }
  else if(mask===12){ file="road-corner"; rotation=180; }
  else if(mask===9){ file="road-corner"; rotation=270; }
  else if(mask===7) file="road-t";
  else if(mask===14){ file="road-t"; rotation=90; }
  else if(mask===13){ file="road-t"; rotation=180; }
  else if(mask===11){ file="road-t"; rotation=270; }
  else file="road-cross";
  return '<img class="illustrated-sprite illustrated-road-art" src="assets/illustrated/'+file+'.png" style="--road-rotation:'+rotation+'deg" alt="" aria-hidden="true">';
}

function artSprite(type,mask,variant,whole){
  variant=variant||0;
  if(type==="road"||type==="entrance") return illustratedRoad(mask);
  if(type==="sports"){

  var files={
    apartment:"apartment",industrial:"industrial",school:"school",
    hospital:"hospital",power:"industrial",water:"park-0"
  };
  var file;
  if(type==="grass") file="grass-"+(variant%3);

  else if(type==="shop") file="shop-"+(variant%2);
  else file=files[type]||"grass-0";

}

function sprite(type,mask,variant,whole){
  variant=variant||0;
  if(ART_STYLE==="illustrated") return artSprite(type,mask,variant,whole);
  var key=type+":"+mask+":"+variant+":"+(whole?1:0);
  if(cache[key]) return cache[key];
  var g;
  if(type==="grass") g=grassSprite(variant);
  else if(type==="road"||type==="entrance") g=roadSprite(mask);
  else if(type==="house") g=houseSprite(variant);
  else if(type==="park") g=parkSprite(variant);
  else if(type==="shop") g=shopSprite(variant);

  cache[key]=toSvg(g);
  return cache[key];
}

var GAME_CONFIG={

function nbTypes(r,c,owner){return DIRS.map(function(d){return at(r+d.dr,c+d.dc);}).filter(function(q){return q&&q.owner===owner;}).map(function(q){return q.type;});}

/* ===================== placement, shared board and ownership ===================== */
function legalRoad(r,c,mask,owner){
  if(at(r,c)!==null)return false;
  var connected=false;
  for(var i=0;i<DIRS.length;i++){
    var d=DIRS[i],q=at(r+d.dr,c+d.dc);
    if(!q||!isRoad(q.type))continue;
    var mine=!!(mask&d.bit),theirs=!!(q.mask&d.opp);
    if(mine!==theirs)return false;
    if(mine&&q.owner===owner)connected=true;
  }
  return connected;
}
function legalBuilding(r,c,owner){
  return at(r,c)===null&&DIRS.some(function(d){var q=at(r+d.dr,c+d.dc);return q&&q.owner===owner&&isRoad(q.type);});
}
function legalFor(item,r,c,owner){
  if(!item||!NAMES[item.type]||item.type==="entrance")return false;
  if(item.type==="road")return legalRoad(r,c,item.mask,owner);
  var cells=cellsFor(item.type,r,c);
  return cells.every(function(p){return at(p[0],p[1])===null;})&&cells.some(function(p){return legalBuilding(p[0],p[1],owner);});
}
function hospitalValue(population){return Math.min(GAME_CONFIG.hospitalMaxAttraction,Math.floor(population/GAME_CONFIG.hospitalPopulationDivisor));}
function putTile(owner,item,r,c){
  var locked=item.type==="hospital"?hospitalValue(calculateTown(owner).population):null;
  cellsFor(item.type,r,c).forEach(function(p){
    var q={type:item.type,owner:owner,mask:item.mask||0,v:item.type==="sports"?p[2]:(item.v||0),root:r+","+c};
    if(locked!==null)q.lockedAttraction=locked;
    S.grid[p[0]][p[1]]=q;
  });
}
function clearTile(type,r,c){cellsFor(type,r,c).forEach(function(p){S.grid[p[0]][p[1]]=null;});}
function openEnds(owner){
  var ends={};
  each(function(r,c,q){if(q&&q.owner===owner&&isRoad(q.type))DIRS.forEach(function(d){if((q.mask&d.bit)&&at(r+d.dr,c+d.dc)===null)ends[(r+d.dr)+","+(c+d.dc)]=true;});});
  return Object.keys(ends).length;
}
function openPlots(owner){var n=0;each(function(r,c,q){if(!q&&legalBuilding(r,c,owner))n++;});return n;}

/* ===================== board-derived population ===================== */
function effect(effects,tile,value,kind,detail){
  effects[tile.key]={type:tile.type,value:value,kind:kind,detail:detail};
  return value;
}
function calculateAccommodation(owner,tiles,effects){
  var houses=0,apartments=0;
  tiles.forEach(function(t){
    if(t.type==="house")houses+=effect(effects,t,GAME_CONFIG.houseAccommodation,"Accommodation","House");
    if(t.type==="apartment"){
      var adjacent=nbTypes(t.r,t.c,owner),active=adjacent.indexOf("park")>=0&&adjacent.indexOf("shop")>=0;
      apartments+=effect(effects,t,active?GAME_CONFIG.apartmentAccommodation:0,"Accommodation",active?"Park and Shop adjacent":"Needs an adjacent Park AND Shop");
    }
  });
  return {houses:houses,apartments:apartments,total:houses+apartments};
}
function calculateParkAttraction(owner,tiles,effects){
  return tiles.filter(function(t){return t.type==="park";}).reduce(function(total,t){
    var active=nbTypes(t.r,t.c,owner).indexOf("house")>=0;
    return total+effect(effects,t,active?GAME_CONFIG.parkAttraction:0,"Attraction",active?"Touches at least one House":"No adjacent House");
  },0);
}
function shopGroupValue(size){return size===1?GAME_CONFIG.shops.one:size===2?GAME_CONFIG.shops.two:GAME_CONFIG.shops.threePlus;}
function calculateShopAttraction(owner,tiles,effects){
  var shops={},seen={},groups=[];
  tiles.forEach(function(t){if(t.type==="shop")shops[t.key]=t;});
  Object.keys(shops).forEach(function(key){
    if(seen[key])return;

    while(queue.length){
      var t=queue.pop();group.push(t);
      DIRS.forEach(function(d){var k=(t.r+d.dr)+","+(t.c+d.dc);if(shops[k]&&!seen[k]){seen[k]=true;queue.push(shops[k]);}});
    }
    var value=shopGroupValue(group.length);
    group.forEach(function(t){effect(effects,t,value,"Attraction",group.length+" Shops in this group · counted once per group");});
    groups.push({size:group.length,value:value,tiles:group.map(function(t){return t.key;})});
  });

}
function calculateIndustryAttraction(owner,tiles,effects){

    var blocked=houses.some(function(h){return gridDistance(t.r,t.c,h.r,h.c)<=GAME_CONFIG.industryHouseRange;});
    return total+effect(effects,t,blocked?0:GAME_CONFIG.industryAttraction,"Attraction",blocked?"House in exclusion range":"No Houses in exclusion range");
  },0);
}
function calculateSchoolAttraction(owner,tiles,effects){
  var homes=tiles.filter(function(t){return t.type==="house"||t.type==="apartment";});
  return tiles.filter(function(t){return t.type==="school";}).reduce(function(total,t){
    var inside=homes.filter(function(h){return gridDistance(t.r,t.c,h.r,h.c)<=GAME_CONFIG.schoolRange;});
    var units=function(home){return home.type==="apartment"?2:1;};
    var count=inside.reduce(function(n,h){return n+units(h);},0);
    var outside=homes.filter(function(h){return inside.indexOf(h)<0;}).reduce(function(n,h){return n+units(h);},0);
    var value=count*GAME_CONFIG.schoolAttractionPerHouse-outside*GAME_CONFIG.schoolOutsideHousePenalty;

function calculateHospitalAttraction(owner,tiles,effects){

    var types={};
    tiles.forEach(function(other){if(other.type!=="sports"&&tileDistance(t,other.r,other.c)<=GAME_CONFIG.sportsRange)types[other.type]=true;});
    var names=Object.keys(types),value=Math.min(GAME_CONFIG.sportsMaxAttraction,names.length*GAME_CONFIG.sportsAttractionPerType);

  },0);

function calculateTown(owner){
  var tiles=townTiles(owner),effects={},homes=calculateAccommodation(owner,tiles,effects);

  var hospital=calculateHospitalAttraction(owner,tiles,effects),sports=calculateSportsAttraction(owner,tiles,effects);

    breakdown:{houses:homes.houses,apartments:homes.apartments,parks:parks,shops:shops.total,industry:industry,school:school,hospital:hospital,sports:sports},
    shopGroups:shops.groups,effects:effects};

function previewPlacement(owner,item,r,c){

  var before=calculateTown(owner),after;

/* ===================== seeded supply and game state ===================== */
function seedNumber(seed){var hash=2166136261;for(var i=0;i<seed.length;i++)hash=Math.imul(hash^seed.charCodeAt(i),16777619);return hash>>>0;}
function random(){S.rng=(Math.imul(1664525,S.rng)+1013904223)>>>0;return S.rng/4294967296;}
function shuffle(items){for(var i=items.length-1;i>0;i--){var j=Math.floor(random()*(i+1)),t=items[i];items[i]=items[j];items[j]=t;}return items;}
function makeItem(type,mask){return {type:type,mask:mask||0,v:Math.floor(random()*(VARIANTS[type]||1))};}
function buildDeck(){
  var deck=[];
  Object.keys(GAME_CONFIG.normalTiles).forEach(function(type){for(var i=0;i<GAME_CONFIG.normalTiles[type];i++)deck.push(makeItem(type));});
  return shuffle(deck);
}
function buildRoadStack(){
  var deck=[];
  Object.keys(GAME_CONFIG.roadTiles).forEach(function(mask){for(var i=0;i<GAME_CONFIG.roadTiles[mask];i++)deck.push(makeItem("road",Number(mask)));});
  return shuffle(deck);
}
function newPlayer(owner){return {owner:owner,civics:CIVIC_TYPES.map(function(type){return {type:type,mask:0,v:0};}),hand:[],tookRoad:false,turns:0};}
function refill(index){
  if(index!==undefined){if(S.deck.length)S.market[index]=S.deck.pop();else S.market.splice(index,1);}
  else while(S.market.length<GAME_CONFIG.marketSize&&S.deck.length)S.market.push(S.deck.pop());
}
function newGame(options){
  options=options||{};clearTimeout(botTimer);botTimer=null;moveHistory=[];
  SIZE=GAME_CONFIG.boardSize;
  var seed=String(options.seed||Date.now());
  S={grid:[],land:[],seed:seed,rng:seedNumber(seed),playMode:options.mode==="local"?"local":"bot",mode:null,you:newPlayer("you"),bot:newPlayer("bot"),
    turn:"you",mode:null,used:0,market:[],deck:[],roads:[],selected:null,preview:null,inspect:null,fresh:null,finalTurn:false,over:false,started:true,paused:false,result:null};
  for(var r=0;r<SIZE;r++){
    S.grid.push(new Array(SIZE).fill(null));
    var row=[];for(var c=0;c<SIZE;c++)row.push(Math.floor(random()*12));S.land.push(row);
  }
  var mid=Math.floor(SIZE/2);
  S.grid[SIZE-1][mid]={type:"entrance",mask:N|E|Wd,owner:"you",v:0,root:(SIZE-1)+","+mid};
  S.grid[0][mid]={type:"entrance",mask:Sd|E|Wd,owner:"bot",v:0,root:"0,"+mid};
  S.deck=buildDeck();S.roads=buildRoadStack();refill();cellEls=null;
  document.getElementById("setup").close();document.getElementById("over").close();
  document.getElementById("board").style.setProperty("--mapsize",SIZE);
  renderLegend();render();
}
function choices(owner){
  var options=S.market.map(function(item,index){return {source:"market",index:index,item:item};}).concat(S[owner].civics.map(function(item,index){return {source:"civic",index:index,item:item};}));
  if(S.roads.length)options.push({source:"road",index:S.roads.length-1,item:S.roads[S.roads.length-1]});
  return options;
}
function takeChoices(owner){
  var p=S[owner],options=[];
  S.market.forEach(function(item,index){if(!isCivic(item.type)||!p.hand.some(function(h){return h.type===item.type;}) )options.push({source:"market",index:index,item:item});});
  if(S.roads.length&&!p.tookRoad)options.push({source:"road",index:S.roads.length-1,item:S.roads[S.roads.length-1]});
  p.civics.forEach(function(item,index){options.push({source:"civic",index:index,item:item});});
  return options;
}
function eachPlacement(owner,item,visit){
  var masks=item.type==="road"?roadRotations(item.mask):[item.mask||0];
  for(var m=0;m<masks.length;m++){
    var probe=Object.assign({},item,{mask:masks[m]});
    for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++)if(legalFor(probe,r,c,owner)&&visit(probe,r,c)===false)return false;
  }
  return true;
}
function hasLegalChoice(owner){
  return choices(owner).some(function(choice){var found=false;eachPlacement(owner,choice.item,function(){found=true;return false;});return found;});
}
function canTake(owner){return S.started&&!S.paused&&!S.over&&S.turn===owner&&S.used<2&&(S.mode===null||S.mode==="take")&&takeChoices(owner).length>0;}
function canPlace(owner){
  if(!S.started||S.paused||S.over||S.turn!==owner||S.used>=2||(S.mode!==null&&S.mode!=="place"))return false;
  return S[owner].hand.some(function(item){var found=false;eachPlacement(owner,item,function(){found=true;return false;});return found;});
}
function canPass(owner){
  if(S.mode==="place")return !canPlace(owner);
  if(S.mode==="take")return !canTake(owner)&&!hasLegalChoice(owner);
  return !hasLegalChoice(owner);
}
function takeTile(source,index,owner){
  owner=owner||S.turn;var p=S[owner],item;
  if(source==="road"){if(!S.roads.length||p.tookRoad)return false;item=S.roads.pop();p.tookRoad=true;}
  else if(source==="market"){item=S.market[index];if(!item||isCivic(item.type)&&p.hand.some(function(h){return h.type===item.type;}))return false;S.market.splice(index,1);refill();}
  else if(source==="civic"){item=p.civics[index];if(!item)return false;p.civics.splice(index,1);}

}
function takeChoice(source,index){

  if(S.used>=2)endTurn();else render();
}
function selectTile(source,index){
  if(!humanTurn())return;
  if(source!=="hand"){
    if(S.mode!==null)return;
    var pool=source==="market"?S.market:source==="road"?S.roads:activePlayer().civics;
    if(!pool[index])return;
    S.selected={source:source,index:index,item:clone(pool[index])};S.preview=null;S.inspect=null;render();return;
  }
  if(!canPlace(S.turn))return;

  S.selected={source:source,index:index,item:clone(list[index])};S.preview=null;S.inspect=null;render();
}
function stagePlacement(r,c){
  if(!humanTurn()||!S.selected)return;
  var preview=previewPlacement(S.turn,S.selected.item,r,c);
  if(!preview)return;
  S.preview=preview;S.inspect=null;render();
}
function saveTurn(){var state=clone(S);state.selected=null;state.preview=null;state.inspect=null;moveHistory.push(state);}
function commitPlacement(choice,r,c){
  if(!S.started||S.paused||S.over||!choice)return false;
  var owner=S.turn,list=choice.source==="hand"?S[owner].hand:[];
  if(choice.source!=="hand"){
    var pool=choice.source==="market"?S.market:choice.source==="road"?S.roads:S[owner].civics,actualPool=pool[choice.index];
    if(!actualPool||actualPool.type!==choice.item.type||!legalFor(choice.item,r,c,owner))return false;
    if(choice.source==="road"&&roadRotations(actualPool.mask).indexOf(choice.item.mask)<0)return false;
    saveTurn();putTile(owner,choice.item,r,c);
    if(choice.source==="market")refill(choice.index);else if(choice.source==="road")S.roads.pop();else pool.splice(choice.index,1);
    S.fresh={r:r,c:c};S.selected=null;S.preview=null;S.inspect=null;completeTurn(owner);return true;
  }
  if(!canPlace(owner))return false;
  var actual=list[choice.index];
  if(!actual||actual.type!==choice.item.type||!legalFor(choice.item,r,c,owner))return false;
  if(actual.type==="road"&&roadRotations(actual.mask).indexOf(choice.item.mask)<0)return false;
  saveTurn();putTile(owner,choice.item,r,c);
  list.splice(choice.index,1);
  S.fresh={r:r,c:c};S.selected=null;S.preview=null;S.inspect=null;
  S.mode="place";S.used++;
  if(owner==="you"&&calculateTown(owner).population>=GAME_CONFIG.winPopulation)S.finalTurn=true;
  if(S.used>=2){completeTurn(owner);}else render();
  return true;
}
function confirmPlacement(){if(humanTurn()&&S.preview&&S.selected)commitPlacement(S.selected,S.preview.r,S.preview.c);}
function completeTurn(owner){
  S[owner].turns++;
  var town=calculateTown(owner);
  if(owner==="you"&&town.population>=GAME_CONFIG.winPopulation)S.finalTurn=true;
  if(owner==="bot"&&(S.finalTurn||town.population>=GAME_CONFIG.winPopulation)){finish("target");return;}
  S.turn=owner==="you"?"bot":"you";S.mode=null;S.used=0;S[owner].tookRoad=false;S[owner].selected=null;
  if(!S.finalTurn&&!hasLegalChoice("you")&&!hasLegalChoice("bot")){finish("blocked");return;}
  render();scheduleBot();
}
function endTurn(){
  if(!S.started||S.paused||S.over||S.turn!=="you")return;
  completeTurn("you");
}
function passTurn(){
  if(!S.started||S.paused||S.over||!canPass(S.turn))return false;
  saveTurn();var owner=S.turn;S.selected=null;S.preview=null;S.inspect=null;completeTurn(owner);return true;
}
function undoMove(){
  if(!moveHistory.length||!S.started||S.paused)return;
  clearTimeout(botTimer);botTimer=null;
  var previous=moveHistory.pop();
  if(previous.mode==="bot"&&previous.turn==="bot"&&moveHistory.length)previous=moveHistory.pop();
  S=previous;S.paused=false;cellEls=null;document.getElementById("over").close();render();scheduleBot();
}
function finish(reason){
  clearTimeout(botTimer);botTimer=null;S.over=true;S.selected=null;S.preview=null;S.inspect=null;
  var one=calculateTown("you"),two=calculateTown("bot");
  S.result={reason:reason,winner:one.population===two.population?null:one.population>two.population?"you":"bot"};

/* ===================== Ada's two-action turn ===================== */
function chooseBotMove(owner){
  var before=calculateTown(owner),plotsBefore=openPlots(owner),endsBefore=openEnds(owner),best=null;
  var candidates=S[owner].hand.map(function(item,index){return {source:"hand",index:index,item:item};});
  if(!candidates.length)candidates=choices(owner);
  candidates.forEach(function(candidate){var item=candidate.item,index=candidate.index;
    eachPlacement(owner,item,function(item,r,c){
      putTile(owner,item,r,c);
      var after=calculateTown(owner),plots=openPlots(owner),ends=openEnds(owner);
      var value=(after.population-before.population)*10+
        Math.min(12,after.accommodation-after.population)*0.7+Math.min(12,after.attraction-after.population)*0.9;
      value+=Math.min(8,plots)*0.6+Math.min(4,ends)*1.8;
      if(item.type==="road")value+=(plots-plotsBefore)*2+(ends-endsBefore)*2;
      if(item.type==="house")value+=1.5;
      if(item.type==="park"||item.type==="shop")value+=1;
      if(isCivic(item.type)&&after.population-before.population<3)value-=5;
      if(item.type==="hospital")value-=Math.max(0,GAME_CONFIG.hospitalMaxAttraction-hospitalValue(before.population))*0.9;
      if(item.type==="sports")value-=3;
      if(ends===0)value-=24;
      if(after.population>=GAME_CONFIG.winPopulation)value+=500;
      value-=Math.abs(r-(owner==="you"?SIZE-1:0))*0.03;
      clearTile(item.type,r,c);
      if(!best||value>best.value)best={source:candidate.source,index:index,item:clone(item),r:r,c:c,value:value};
    });
  });
  return best;
}
function scheduleBot(){
  clearTimeout(botTimer);botTimer=null;
  if(S.started&&!S.paused&&!S.over&&S.playMode==="bot"&&S.turn==="bot")botTimer=setTimeout(botTurn,450);
}
function botTurn(){
  botTimer=null;
  if(!S.started||S.paused||S.over||S.playMode!=="bot"||S.turn!=="bot")return;
  var owner="bot",p=S[owner],move=p.hand.length?chooseBotMove(owner):null;
  S.mode=move?"place":"take";S.used=0;p.tookRoad=false;
  for(var i=0;i<2;i++){
    if(S.mode==="place"){
      move=chooseBotMove(owner);if(!move)break;
      if(!commitPlacement(move,move.r,move.c))break;
    }else{
      var opts=takeChoices(owner);if(!opts.length)break;
      var pick=opts[0];
      for(var j=0;j<opts.length;j++)if(opts[j].source==="road"){pick=opts[j];break;}
      if(!takeTile(pick.source,pick.index,owner))break;
    }
  }
  if(!S.over&&S.turn===owner){S.used=2;completeTurn(owner);}
}

function contextualRanges(){

  if(S.inspect){var q=at(S.inspect.r,S.inspect.c);if(q){var root=(q.root||S.inspect.r+","+S.inspect.c).split(",");target={r:Number(root[0]),c:Number(root[1])};item=q;}}
  function add(t,r,c){

function makeTileButton(choice,owner){

function statLines(town){return '<div class="scoreline"><span>Accommodation</span><span>'+town.accommodation+'</span></div>'+ '<div class="scoreline"><span>Attraction</span><span>'+town.attraction+'</span></div>'+ '<div class="scoreline population"><span>Population</span><span>'+town.population+'</span></div>';}
function breakdownHTML(owner){
  var town=calculateTown(owner),b=town.breakdown;
  var labels={houses:"Houses",apartments:"Apartments",parks:"Parks",shops:"Shop groups",industry:"Industry",school:"School",hospital:"Hospital (locked)",sports:"Sports Ground"};
  var h='<h3>'+playerName(owner)+'</h3><b>Accommodation</b>';
  ["houses","apartments"].forEach(function(k){h+='<div class="scoreline"><span>'+labels[k]+'</span><span>'+b[k]+'</span></div>';});
  h+='<b>Attraction</b>';
  ["parks","shops","industry","school","hospital","sports"].forEach(function(k){h+='<div class="scoreline"><span>'+labels[k]+'</span><span>'+b[k]+'</span></div>';});
  return h+statLines(town);
}
function renderPreview(){
  var el=document.getElementById("placementpreview"),p=S.preview;
  el.hidden=!p;
  if(!p){el.innerHTML="";return;}
  var h='<b>'+NAMES[S.selected.item.type]+' · row '+(p.r+1)+', column '+(p.c+1)+'</b><table><tr><th>Town</th><th>Now</th><th>After</th></tr>';
  ["accommodation","attraction","population"].forEach(function(k){h+='<tr><td>'+k.charAt(0).toUpperCase()+k.slice(1)+'</td><td>'+p.before[k]+'</td><td>'+p.after[k]+'</td></tr>';});
  h+='</table>';
  if(S.selected.item.type==="hospital")h+='<p>Locks at +'+hospitalValue(p.before.population)+' Attraction.</p>';
  p.changes.forEach(function(change){h+='<p>'+NAMES[change.type]+' ('+change.key.split(",").map(function(n){return Number(n)+1;}).join(", ")+'): '+change.from+' → '+change.to+'. '+change.detail+'.</p>';});
  if(S.selected.item.type!=="road"){
    putTile(S.turn,S.selected.item,p.r,p.c);var ends=openEnds(S.turn);clearTile(S.selected.item.type,p.r,p.c);
    if(!ends)h+='<p><b>This closes your last road exit.</b></p>';
  }
  el.innerHTML=h;
}
function render(){
  ensureBoard();fitBoard();paintBoard();
  var owner=S.turn,item=S.selected&&S.selected.item;
  ["you","bot"].forEach(function(who){
    var box=document.getElementById("town-"+who);box.innerHTML='<b>'+playerName(who)+(S.turn===who&&!S.over?' · Active':'')+'</b>'+statLines(calculateTown(who));
    box.classList.toggle("active-town",S.turn===who&&!S.over);
  });
  document.getElementById("winrule").textContent="Target: "+GAME_CONFIG.winPopulation+" Population";
  var market=document.getElementById("market");market.innerHTML="";
  S.market.forEach(function(it,i){market.appendChild(makeTileButton({source:"market",index:i,item:it},owner));});
  if(!S.market.length)market.textContent="Building supply exhausted.";
  document.getElementById("marketcount").textContent="Building market · "+S.deck.length+" buildings left in supply";
  var roads=document.getElementById("roadrow");roads.innerHTML="";
  if(S.roads.length)roads.appendChild(makeTileButton({source:"road",index:S.roads.length-1,item:S.roads[S.roads.length-1]},owner));
  else roads.textContent="Road stack exhausted.";
  document.getElementById("roadcount").textContent="Road stack · "+S.roads.length+" left · top tile only";
  var hand=document.getElementById("hand");hand.innerHTML="";
  if(S[owner].hand.length)S[owner].hand.forEach(function(it,i){hand.appendChild(makeTileButton({source:"hand",index:i,item:it},owner));});
  else hand.textContent="Nothing in hand.";
  document.getElementById("handlabel").textContent=playerName(owner)+" · hand (place up to two)";
  var civics=document.getElementById("civics");civics.innerHTML="";
  S[owner].civics.forEach(function(it,i){civics.appendChild(makeTileButton({source:"civic",index:i,item:it},owner));});
  if(!S[owner].civics.length)civics.textContent="All three Civic Tiles have been used.";
  document.getElementById("civiclabel").textContent=playerName(owner)+" · unused Civic Tiles";
  document.getElementById("hospitalhint").textContent=S[owner].civics.some(function(it){return it.type==="hospital";})?"Hospital would currently lock at +"+hospitalValue(calculateTown(owner).population)+" Attraction.":"";
  var mayPass=canPass(owner),msg;
  if(!S.started)msg="Choose players and start a new town.";
  else if(S.over)msg="Game over. Inspect any building, view Results, or Undo.";
  else if(S.paused)msg="Game paused.";
  else if(!humanTurn())msg="Ada is choosing a tile…";
  else if(mayPass)msg=playerName(owner)+": no legal tiles available. Pass your turn.";
  else if(item)msg=playerName(owner)+": "+(S.preview?"Review the preview, then Confirm placement.":"Select a marked plot to preview "+NAMES[item.type]+".");
  else if(S.mode==="take")msg=playerName(owner)+": take one more tile.";
  else if(S.mode==="place")msg=playerName(owner)+": place another tile from your hand.";
  else msg=playerName(owner)+": either take two tiles or place two tiles from your hand.";
  if(S.finalTurn&&!S.over)msg="Final turn for "+playerName("bot")+" — Player 1 reached the target. "+msg;
  document.getElementById("status").textContent=msg;
  var info="";
  if(S.inspect){
    var q=at(S.inspect.r,S.inspect.c);
    if(q){var key=q.root||S.inspect.r+","+S.inspect.c,e=calculateTown(q.owner).effects[key];
      info='<b>'+NAMES[q.type]+' · '+playerName(q.owner)+'</b><br>'+ruleText(q.type)+(e?'<br><b>'+e.value+' '+e.kind+'</b> · '+e.detail:"");}
  } else if(item)info='<b>'+NAMES[item.type]+'</b><br>'+ruleText(item.type,owner);
  if(info&&contextualRanges().length)info+='<br><small>Amber squares show the selected range or adjacency requirements.</small>';
  document.getElementById("tileinfo").innerHTML=info;
  document.getElementById("tileinfo").hidden=!info;
  document.getElementById("rotate").disabled=!humanTurn()||S.mode!=="place"||!item||item.type!=="road";
  document.getElementById("confirm").disabled=!humanTurn()||!S.preview;
  document.getElementById("cancelplacement").disabled=!humanTurn()||!S.selected;
  document.getElementById("endturn").disabled=!humanTurn()||!mayPass;
  document.getElementById("undo").disabled=!S.started||S.paused||!moveHistory.length;
  document.getElementById("finish").disabled=!S.over;
  renderPreview();
  document.getElementById("breakdown").innerHTML=breakdownHTML("you")+breakdownHTML("bot");
  var empty=0;each(function(r,c,q){if(!q)empty++;});
  document.getElementById("mapinfo").textContent=SIZE+" × "+SIZE+" · "+empty+" empty plots · Turns "+S.you.turns+" / "+S.bot.turns+" · Seed: "+S.seed;
}
function showResults(){
  if(!S.over||!S.result)return;
  document.getElementById("overtitle").textContent=S.result.winner?playerName(S.result.winner)+" wins":"Draw";
  document.getElementById("overbody").innerHTML='<p>'+(S.result.reason==="target"?"Both players have had equal turns. Highest Population wins.":"Neither player can place an available building, face-up road or Civic Tile. Highest Population wins.")+'</p><h3>'+playerName("you")+'</h3>'+statLines(calculateTown("you"))+'<h3>'+playerName("bot")+'</h3>'+statLines(calculateTown("bot"));
  var d=document.getElementById("over");if(!d.open)d.showModal();
}
function renderLegend(){
  var types=["house","apartment","park","shop","industrial","school","hospital","sports","road"];
  document.getElementById("legend").innerHTML='<p class="note"><b>Population = min(Accommodation, Attraction).</b> Target: '+GAME_CONFIG.winPopulation+'. Player 2 gets a final turn if Player 1 reaches the target first.</p><p class="note">'+(GAME_CONFIG.distanceMetric==="manhattan"?"Ranges count orthogonal grid steps (Manhattan): diagonal offsets cost two steps.":"Ranges use square distance: diagonals count as one step.")+' Adjacency and Shop connections always require a shared edge. Only your own buildings count. Sports range starts at the nearest square of its '+GAME_CONFIG.sportsFootprint+' × '+GAME_CONFIG.sportsFootprint+' footprint.</p>'+types.map(function(type){
    var art=sprite(type,type==="road"?7:0,0,true);
    if(type==="apartment")art=art.replace('<svg class="pixel-sprite"','<svg class="pixel-sprite tall"');
    return '<div>'+art+'<span><b>'+NAMES[type]+'</b><br>'+ruleText(type)+'</span></div>';
  }).join("")+'<p>Three buildings in the market; roads have their own stack with one showing. Start with only a T-intersection each. Each turn is either two takes into your hand or two placements from your hand. You may pass when the chosen action has no legal move. If neither player can place, highest Population wins.</p>';
}
function setArtStyle(style){
  if(style!=="pixel"&&style!=="illustrated")return;
  ART_STYLE=style;if(document.documentElement)document.documentElement.setAttribute("data-art",style);
  document.getElementById("artstyle").value=style;
  try{if(window.localStorage)window.localStorage.setItem("dusk-town-art-style",style);}catch(ignoreArtStorage){}
  if(cellEls)cellEls.forEach(function(el){el.dataset.sig="";});renderLegend();if(S)render();
}
function fitBoard(){
  var col=document.querySelector(".boardcol"),board=document.getElementById("board");if(!col||!board||!col.clientWidth)return;
  var chrome=ART_STYLE==="illustrated"?12+2*(SIZE-1):8+(SIZE-1);
  board.style.setProperty("--cellpx",Math.max(14,Math.min(46,Math.floor((col.clientWidth-chrome)/SIZE)))+"px");
}
function doRotate(){
  if(!humanTurn()||!S.selected||S.selected.item.type!=="road")return;
  S.selected.item.mask=rotateMask(S.selected.item.mask);S.preview=null;render();
}
function showSetup(){
  clearTimeout(botTimer);botTimer=null;S.paused=true;document.getElementById("over").close();
  document.getElementById("playmode").value=S.playMode;document.getElementById("gameseed").value=S.started?S.seed:"";
  document.getElementById("cancelsetup").hidden=!S.started;render();
  document.getElementById("setupsummary").textContent=GAME_CONFIG.boardSize+" × "+GAME_CONFIG.boardSize+" shared board. Target: "+GAME_CONFIG.winPopulation+" Population. Each player starts with only a T-intersection on the board and three personal Civic Tiles. Choose from three face-up buildings or the top tile of the separate road stack.";
  document.getElementById("setup").showModal();
}
function closeSetup(){if(!S.started)return;document.getElementById("setup").close();S.paused=false;render();scheduleBot();}
window.addEventListener("resize",fitBoard);
if(window.visualViewport)window.visualViewport.addEventListener("resize",fitBoard);
document.getElementById("artstyle").value=ART_STYLE;
document.getElementById("artstyle").addEventListener("change",function(){setArtStyle(this.value);});
document.getElementById("rotate").addEventListener("click",doRotate);
document.getElementById("confirm").addEventListener("click",confirmPlacement);
document.getElementById("cancelplacement").addEventListener("click",function(){S.selected=null;S.preview=null;S.inspect=null;render();});
document.getElementById("endturn").addEventListener("click",function(){if(humanTurn())passTurn();});
document.getElementById("undo").addEventListener("click",undoMove);
document.getElementById("finish").addEventListener("click",showResults);
document.getElementById("restart").addEventListener("click",showSetup);
document.getElementById("again").addEventListener("click",showSetup);
document.getElementById("cancelsetup").addEventListener("click",closeSetup);
document.getElementById("setup").addEventListener("cancel",function(ev){ev.preventDefault();closeSetup();});
document.getElementById("startgame").addEventListener("click",function(){newGame({mode:document.getElementById("playmode").value,seed:document.getElementById("gameseed").value});});
document.getElementById("viewmap").addEventListener("click",function(){document.getElementById("over").close();document.getElementById("board").scrollIntoView({block:"start"});});
document.getElementById("logtown").addEventListener("click",function(){console.log("Dusk Town",{seed:S.seed,you:calculateTown("you"),player2:calculateTown("bot")});});
document.addEventListener("keydown",function(ev){if((ev.key==="r"||ev.key==="R")&&!S.paused)doRotate();});
newGame({mode:"local"});S.started=false;showSetup();
</script>
</body>
</html>
